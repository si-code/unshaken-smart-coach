[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]